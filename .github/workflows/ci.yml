name: CI - smoke on PR, regression nightly

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    # Runs daily at 02:00 IST (India Time). GitHub Actions uses UTC,
    # so 02:00 IST = 20:30 UTC previous day -> cron "30 20 * * *"
    - cron: '30 20 * * *'
  workflow_dispatch: {} # allow manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Determine test group (smoke on PR, regression on schedule/manual)
        id: set_group
        run: |
          echo "Event = $GITHUB_EVENT_NAME"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TEST_GROUP=smoke" >> $GITHUB_ENV
          else
            echo "TEST_GROUP=regression" >> $GITHUB_ENV
          fi

      - name: Run tests with Maven (headless)
        run: mvn -B -Dheadless=true -Dgroups=${{ env.TEST_GROUP }} test

      - name: Upload Extent Report & screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_id }}
          path: |
            **/ExtentReport.html
            **/screenshots/**
            target/surefire-reports/

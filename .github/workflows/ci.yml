name: UI + API Automation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: 17

    - name: Cache Maven repo
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Run tests with Maven (Headless)
      run: mvn -B -Dheadless=true test

    - name: Upload Extent Report & Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ExtentReport
        path: |
          **/ExtentReport.html
          **/screenshots/**
